<!doctype html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIN AUTO FINDER PRO</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0e1014;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
padding:16px
}

.box{
max-width:760px;
margin:auto;
background:#191c22;
border-radius:22px;
padding:22px
}

h1{
text-align:center;
font-size:34px;
margin:8px 0
}

.sub{
text-align:center;
color:#aeb4bd
}

input{
width:100%;
padding:17px;
border-radius:12px;
border:1px solid #555b65;
background:#272b32;
color:#fff;
font-size:18px
}

button{
width:100%;
padding:17px;
margin-top:12px;
border:0;
border-radius:12px;
font-size:18px;
font-weight:800
}

.status{
margin-top:15px;
padding:13px;
border-radius:11px;
background:#242830
}

.section{
margin-top:20px;
font-size:20px;
font-weight:800
}

.row{
display:flex;
justify-content:space-between;
gap:18px;
background:#252931;
margin-top:8px;
padding:13px;
border-radius:10px
}

.label{
color:#aeb4bd;
flex:1
}

.value{
text-align:right;
font-weight:700;
flex:1;
word-break:break-word
}
</style>
</head>

<body>

<div class="box">

<h1>🔧 VIN AUTO FINDER PRO</h1>

<p class="sub">
VIN pretraga za vozila
</p>

<input
id="vin"
maxlength="17"
placeholder="Unesi 17 znakova VIN-a"
>

<button onclick="searchVIN()">
PRETRAŽI VIN
</button>

<div id="status" class="status">
Unesi VIN i pritisni PRETRAŽI VIN.
</div>

<div id="results"></div>

</div>

<script>

const labels={

VIN:"VIN",
Make:"Marka",
Manufacturer:"Proizvođač",
Model:"Model",
ModelYear:"Godište",
Series:"Serija",
Trim:"Oprema / paket",

VehicleType:"Tip vozila",
BodyClass:"Karoserija",

Doors:"Vrata",
Seats:"Sjedišta",

EngineModel:"Oznaka/model motora",
EngineCylinders:"Cilindri",

DisplacementL:"Kubikaža (L)",
DisplacementCC:"Kubikaža (cc)",

EngineHP:"Snaga (KS)",
EngineKW:"Snaga (kW)",

FuelTypePrimary:"Gorivo",

TransmissionStyle:"Mjenjač",
TransmissionSpeeds:"Broj brzina",

DriveType:"Pogon",

PlantCompanyName:"Fabrika",
PlantCity:"Grad proizvodnje",
PlantState:"Regija proizvodnje",
PlantCountry:"Država proizvodnje",

PlantPostalCode:"Poštanski broj fabrike",

Turbo:"Turbo"

};

function nice(k){

return labels[k] ||
k.replace(/([a-z])([A-Z])/g,"$1 $2");

}

function esc(v){

return String(v).replace(/[&<>"']/g,function(c){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c];

});

}

async function searchVIN(){

const vin=
document.getElementById("vin")
.value
.trim()
.toUpperCase();

const status=
document.getElementById("status");

const results=
document.getElementById("results");

results.innerHTML="";

if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){

status.textContent=
"❌ VIN mora imati tačno 17 znakova.";

return;

}

status.textContent=
"⏳ Pretraga baze...";

try{

const response=await fetch(

"https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValuesExtended/"
+
encodeURIComponent(vin)
+
"?format=json"

);

if(!response.ok)
throw new Error();

const json=
await response.json();

const car=
json.Results &&
json.Results[0];

if(!car){

status.textContent=
"⚠️ Baza nije vratila podatke.";

return;

}

const entries=
Object.entries(car)
.filter(function(item){

const key=item[0];
const value=item[1];

if(
key==="ErrorCode" ||
key==="ErrorText"
)
return false;

if(
value===null ||
value===undefined
)
return false;

const text=
String(value).trim();

if(text==="")
return false;

if(text==="0")
return false;

if(
text==="Not Applicable" ||
text==="Not Available" ||
text==="N/A"
)
return false;

return true;

});

if(!entries.length){

status.textContent=
"⚠️ VIN je pronađen, ali nema dostupnih podataka.";

return;

}

const priority=[

"VIN",
"Make",
"Model",
"ModelYear",
"Manufacturer",
"Series",
"Trim",
"BodyClass",
"VehicleType",
"EngineModel",
"EngineCylinders",
"DisplacementL",
"DisplacementCC",
"EngineHP",
"EngineKW",
"FuelTypePrimary",
"TransmissionStyle",
"TransmissionSpeeds",
"DriveType",
"Doors",
"Seats",
"PlantCountry",
"PlantCity"

];

entries.sort(function(a,b){

const ai=
priority.indexOf(a[0]);

const bi=
priority.indexOf(b[0]);

return
(ai<0?999:ai)
-
(bi<0?999:bi);

});

status.textContent=
"✅ Vozilo pronađeno — dostupno podataka: "
+
entries.length;

results.innerHTML=
'<div class="section">Podaci o vozilu</div>'
+
entries.map(function(item){

const key=item[0];
const value=item[1];

return `

<div class="row">

<span class="label">
${esc(nice(key))}
</span>

<span class="value">
${esc(value)}
</span>

</div>

`;

}).join("");

}
catch(error){

status.textContent=
"❌ Nije moguće spojiti se na VIN bazu. Provjeri internet i pokušaj ponovo.";

}

}

document
.getElementById("vin")
.addEventListener("input",function(){

this.value=
this.value
.replace(/[^A-Za-z0-9]/g,"")
.toUpperCase();

});

</script>

</body>
</html>
